name: Build Docker Image

on:
  push:
    branches: [main, old_working]
  workflow_dispatch:

concurrency:
  group: netflix-n-hack-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/netflix-n-hack

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true

          build-args: |
            BUILD_JOBS=2
            IP_SCRIPT=${{ vars.IP_SCRIPT }}
            IP_SCRIPT_PORT=${{ vars.IP_SCRIPT_PORT }}

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Trigger Portainer webhook for automatic deployment
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            "${PORTAINER_WEBHOOK_URL}"
